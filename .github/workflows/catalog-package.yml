name: Catalog package
on:
  push:
  pull_request:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - run: python scripts/build_catalog.py --check
      - run: python -m unittest test_catalog_policy.py
      - run: python -m py_compile catalog/__init__.py
      - run: node --check catalog/desktop/plugin.js
      - run: python -m unittest test_deepseek_pricing.py test_profile_switch.py test_probe_install.py test_probe_runtime.py test_provider_controls.py test_probe_env_fallback.py
      - run: node --test test_profile_routing.cjs
      - run: python -m pip install httpx==0.28.1
      - run: python -m unittest test_catalog_readonly.py test_deepseek_balance.py
      - run: node --test test_profile_routing.cjs
        env:
          HERMES_TEST_CATALOG: '1'
